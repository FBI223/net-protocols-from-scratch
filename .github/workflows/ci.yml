name: CI

on:
  push:
    branches: [main]          # run after every push to main
  pull_request:               # and on every pull request

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # download the repository
      - uses: actions/setup-go@v5            # install Go
        with:
          go-version-file: go.mod            # use the version from go.mod
      - run: go vet ./...                    # static analysis
      - run: test -z "$(gofmt -l .)"         # fail if any file is not gofmt-ed
      - run: go test ./... -race -count=1    # tests with the race detector

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable  # install Rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2         # cache dependencies between runs
      - run: cargo fmt --all -- --check      # formatting
      - run: cargo clippy --workspace --all-targets -- -D warnings   # lints
      - run: cargo test --workspace --locked # tests; Cargo.lock must be up to date

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash check-layout.sh
      - run: bash check-layout.sh --markdown >> "$GITHUB_STEP_SUMMARY"
        if: always()